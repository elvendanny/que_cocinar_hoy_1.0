server.port=8081
spring.application.name=api-auth-deber3
spring.config.import=optional:file:./configuracion-local/api-auth.properties,optional:file:../configuracion-local/api-auth.properties
spring.datasource.url=jdbc:mariadb://localhost:3306/cocina_cero_d3_auth_db
spring.datasource.username=cocina_d3_auth_user
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
server.error.include-stacktrace=never
app.seed.enabled=true
app.internal-key=${INTERNAL_KEY:}
app.jwt-secret=${JWT_SECRET:}
app.admin-email=${ADMIN_EMAIL:admin@cocinacero.local}
app.admin-password=${ADMIN_PASSWORD:}
app.gmail-token=./configuracion-local/token.json
app.gmail-from=${GMAIL_FROM:}

# Navegador Angular: lista de orígenes exactos, separados por coma.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
